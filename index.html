<script type="module">
// ===== ▼公開時に設定する項目 =====
const CONFIG = {
  SUPABASE_URL: 'https://juobmpjwejiatufwztsr.supabase.co',   // 例: 'https://xxxxxxxx.supabase.co'（空ならデモモード）
  SUPABASE_KEY: 'sb_publishable_sygKVx4njdj9VNeE8n18Sg_Bd-EPEjm',   // Publishable key（sb_publishable_…）または anon key。secret / service_role は絶対に入れない
  SITE_URL: '',       // シェアに付けるURL。空なら公開中のページURLを自動使用
  HASHTAGS: '#元号制定ゲーム',
  MIN_YEAR: 2027,
  MAX_YEAR: 9999,     // schema.sql の制約と揃えること
  MAX_LENGTH: 30,
};
// ===== ▲ここまで =====

const X_INTENT = 'https://x.com/intent/post';
const W = 44;
const TL_BUFFER = 20;
const PAGE_SIZE = 1000;
const LIST_STEP = 100;
const { MIN_YEAR: MIN, MAX_YEAR: MAX, MAX_LENGTH } = CONFIG;
const TOTAL = MAX - MIN + 1;
const KANJI2 = /^[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]{2}$/;
const REAL_ERAS = [
  { name: '明治', start: 1868, end: 1912, to: '7月29日' },
  { name: '大正', start: 1912, end: 1926, from: '7月30日', to: '12月24日' },
  { name: '昭和', start: 1926, end: 1989, from: '12月25日', to: '1月7日' },
  { name: '平成', start: 1989, end: 2019, from: '1月8日', to: '4月30日' },
  { name: '令和', start: 2019, end: 2026, from: '5月1日' },
];

// ===== ユーティリティ =====
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const storage = {
  get(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch {
      // 保存できない環境では何もしない
    }
  },
};

const mine = new Set(storage.get('gengo-mine', []));
const saveMine = () => storage.set('gengo-mine', [...mine]);
let store = null;
let eras = [];
let busy = false;
let listLimit = LIST_STEP;
let lastRefresh = 0;

const eraAt = (y) => eras.find((e) => e.start_year <= y && y <= e.end_year);
const yearLabel = (name, n) => `${name}${n === 1 ? '元' : n}年`;
const periodText = (s, e) => (s === e ? `${s}年` : `${s}年〜${e}年`);
const hue = (name) => [...name].reduce((a, c) => a + c.codePointAt(0) * 7, 0) % 360;
const eraShareText = (e) => `私は${periodText(e.start_year, e.end_year)}の元号を${e.name}として制定しました！`;

// 秘密鍵（全権限）が誤って設定されていないか確認
function isSecretKey(key) {
  if (key.startsWith('sb_secret_')) return true;
  try {
    const payload = JSON.parse(atob(key.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return payload.role === 'service_role';
  } catch {
    return false;
  }
}

function pageUrl() {
  if (CONFIG.SITE_URL) return CONFIG.SITE_URL;
  if (!location.protocol.startsWith('http')) return '';
  return location.origin + location.pathname.replace(/index\.html$/, '');
}

function xIntent(text) {
  const body = CONFIG.HASHTAGS ? `${text}\n${CONFIG.HASHTAGS}` : text;
  const page = pageUrl();
  return `${X_INTENT}?text=${encodeURIComponent(body)}${page ? `&url=${encodeURIComponent(page)}` : ''}`;
}

function maxLengthFrom(start) {
  if (!Number.isInteger(start) || start < MIN || start > MAX || eraAt(start)) return 0;
  const next = eras.find((e) => e.start_year > start);
  return Math.min(MAX_LENGTH, next ? next.start_year - start : Infinity, MAX - start + 1);
}

function firstFreeYear() {
  let y = MIN;
  for (const e of eras) {
    if (e.start_year <= y && y <= e.end_year) y = e.end_year + 1;
  }
  return y <= MAX ? y : null;
}

function setMode(text, cls = '') {
  $('mode').textContent = text;
  $('mode').className = `mode ${cls}`;
}

let toastTimer;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = isErr ? 'show err' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3000);
}

function errorMessage(err) {
  if (err?.code === '23P01') return 'タッチの差で先に制定されました。別の期間を選んでください。';
  if (err?.code === '23514') return '条件（漢字2文字・期間・年の範囲）を満たしていません。';
  if (err?.code === '42501') return 'サーバーの権限設定に問題があります（管理者はRLSとGRANTを確認）。';
  return '通信エラーが発生しました。時間をおいて再度お試しください。';
}

// ===== 保存先（デモ: localStorage / オンライン: Supabase） =====
const localStore = {
  KEY: 'gengo-eras-demo',
  async list() {
    return storage.get(this.KEY, []);
  },
  async create(era) {
    const all = await this.list();
    if (all.some((e) => e.start_year <= era.end_year && era.start_year <= e.end_year)) {
      throw Object.assign(new Error('overlap'), { code: '23P01' });
    }
    const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
    const row = { id, ...era };
    all.push(row);
    storage.set(this.KEY, all);
    return row;
  },
};

async function createSupabaseStore() {
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const db = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  const cols = 'id, name, start_year, end_year';
  return {
    async list() {
      const rows = [];
      for (let from = 0; ; from += PAGE_SIZE) {
        const { data, error } = await db.from('eras').select(cols).order('start_year').range(from, from + PAGE_SIZE - 1);
        if (error) throw error;
        rows.push(...data);
        if (data.length < PAGE_SIZE) break;
      }
      return rows;
    },
    async create(era) {
      const { data, error } = await db.from('eras').insert(era).select(cols).single();
      if (error) throw error;
      return data;
    },
  };
}

// ===== フォーム =====
function readForm() {
  const name = $('name').value.trim();
  const start = Number($('start').value);
  const len = Number($('len').value);
  const end = start + len - 1;
  const maxLen = maxLengthFrom(start);
  let nameErr = '';
  let periodErr = '';
  if (!name) nameErr = '元号名を入力してください';
  else if (!KANJI2.test(name)) nameErr = '漢字2文字で入力してください';
  if (!Number.isInteger(start) || start < MIN || start > MAX) periodErr = `開始年は${MIN}〜${MAX}年で入力してください`;
  else if (eraAt(start)) periodErr = `${start}年はすでに「${eraAt(start).name}」の期間です`;
  else if (len > maxLen) periodErr = `この開始年からは最長${maxLen}年までです`;
  return { name, start, len, end, nameErr, periodErr, ok: !nameErr && !periodErr };
}

function updateForm({ follow = false } = {}) {
  const maxLen = maxLengthFrom(Number($('start').value));
  for (const opt of $('len').options) opt.disabled = maxLen > 0 && Number(opt.value) > maxLen;
  if (maxLen > 0 && Number($('len').value) > maxLen) $('len').value = String(maxLen);

  const f = readForm();
  $('preview').textContent = f.name ? [...f.name].slice(0, 2).join('') : '◯◯';
  $('preview').classList.toggle('placeholder', !!f.nameErr);

  const dup = !f.nameErr && (eras.some((e) => e.name === f.name) || REAL_ERAS.some((e) => e.name === f.name));
  const nh = $('nameHint');
  nh.className = f.name && f.nameErr ? 'hint err' : 'hint';
  nh.textContent = !f.name ? '漢字2文字で入力' : f.nameErr || (dup ? '⚠ 同名の元号あり（制定は可能）' : '✓ OK');

  const ph = $('periodHint');
  ph.className = f.periodErr ? 'hint full err' : 'hint full';
  ph.textContent = f.periodErr
    || `${periodText(f.start, f.end)}（${f.len}年間）｜${f.start}年が「${f.nameErr ? '◯◯' : f.name}元年」に`;

  $('submit').disabled = !f.ok || busy || !store;
  renderSelection(f, follow);
}

function stepYear(d) {
  let y = Number($('start').value);
  y = Number.isInteger(y) && y >= MIN && y <= MAX ? y + d : (firstFreeYear() ?? MIN);
  const e = eraAt(y);
  if (e) y = d > 0 ? e.end_year + 1 : e.start_year - 1;
  $('start').value = Math.min(MAX, Math.max(MIN, y));
  updateForm({ follow: true });
}

// ===== 年表（見えている範囲だけ描画） =====
function scrollTimelineTo(year) {
  const tl = $('tl');
  const left = Math.max(0, (year - MIN) * W - tl.clientWidth / 3);
  const far = Math.abs(left - tl.scrollLeft) > tl.clientWidth * 20;
  tl.scrollTo({ left, behavior: far ? 'auto' : 'smooth' });
}

function renderTimeline() {
  const tl = $('tl');
  const first = Math.max(MIN, MIN + Math.floor(tl.scrollLeft / W) - TL_BUFFER);
  const last = Math.min(MAX, MIN + Math.ceil((tl.scrollLeft + tl.clientWidth) / W) + TL_BUFFER);
  let html = '';
  for (let y = first; y <= last; y++) {
    html += `<span class="yr${y % 10 === 0 ? ' dec' : ''}" style="left:${(y - MIN) * W}px">${y}</span>`;
  }
  $('years').innerHTML = html;
  $('blocks').innerHTML = eras
    .filter((e) => e.end_year >= first && e.start_year <= last)
    .map((e) => {
      const len = e.end_year - e.start_year + 1;
      const style = `left:${(e.start_year - MIN) * W}px;width:${len * W}px;--h:${hue(e.name)}`;
      const title = `${e.name}：${periodText(e.start_year, e.end_year)}`;
      return `<div class="blk${mine.has(e.id) ? ' mine' : ''}" style="${style}" title="${esc(title)}">${esc(e.name)}</div>`;
    })
    .join('');
  const viewFirst = Math.min(MAX, MIN + Math.floor(tl.scrollLeft / W));
  const viewLast = Math.min(MAX, MIN + Math.floor((tl.scrollLeft + tl.clientWidth) / W));
  $('tlRange').textContent = `表示中：${viewFirst}〜${viewLast}年`;
  drawOverview();
}

let tlRaf = 0;
function scheduleTimeline() {
  if (tlRaf) return;
  tlRaf = requestAnimationFrame(() => {
    tlRaf = 0;
    renderTimeline();
  });
}

function drawOverview() {
  const c = $('ov');
  const w = c.clientWidth;
  const h = 28;
  if (!w) return;
  const dpr = window.devicePixelRatio || 1;
  if (c.width !== Math.round(w * dpr)) {
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
  }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = '#fff';
  g.fillRect(0, 0, w, h);
  const sx = w / TOTAL;
  for (const e of eras) {
    g.fillStyle = mine.has(e.id) ? '#d4a017' : `hsl(${hue(e.name)}, 55%, 62%)`;
    g.fillRect((e.start_year - MIN) * sx, 4, Math.max(1, (e.end_year - e.start_year + 1) * sx), h - 8);
  }
  const tl = $('tl');
  const vx = (tl.scrollLeft / W) * sx;
  const vw = Math.max(4, (tl.clientWidth / W) * sx);
  g.strokeStyle = '#b7282e';
  g.lineWidth = 2;
  g.strokeRect(Math.min(vx, w - vw) + 1, 1, vw - 2, h - 2);
}

function renderSelection(f, follow) {
  const box = $('selBox');
  box.hidden = !!f.periodErr;
  if (f.periodErr) return;
  box.style.left = `${(f.start - MIN) * W}px`;
  box.style.width = `${f.len * W}px`;
  if (follow) scrollTimelineTo(f.start);
}

function renderStats() {
  const taken = eras.reduce((s, e) => s + e.end_year - e.start_year + 1, 0);
  $('stats').textContent = `制定済み ${taken.toLocaleString()}年／空き ${(TOTAL - taken).toLocaleString()}年`;
}

// ===== 一覧・変換 =====
function renderList() {
  $('count').textContent = eras.length.toLocaleString();
  const more = $('more');
  if (!eras.length) {
    $('list').innerHTML = '<li class="empty">まだ元号はありません。最初の名付け人になろう！</li>';
    more.hidden = true;
    return;
  }
  $('list').innerHTML = eras.slice(0, listLimit).map((e) => {
    const len = e.end_year - e.start_year + 1;
    const own = mine.has(e.id)
      ? `<span class="badge">あなたが制定</span><a class="btn-x small" href="${esc(xIntent(eraShareText(e)))}" target="_blank" rel="noopener">𝕏 シェア</a>`
      : '';
    return `<li><span class="era-name">${esc(e.name)}</span><span class="era-period">${periodText(e.start_year, e.end_year)}（${len}年間）</span>${own}</li>`;
  }).join('');
  const rest = eras.length - listLimit;
  more.hidden = rest <= 0;
  more.textContent = `もっと見る（残り${rest.toLocaleString()}件）`;
}

function convertInfo(y) {
  if (!Number.isInteger(y)) return { html: '西暦を整数で入力してください。' };
  if (y < 1868) return { html: '1868年（明治元年）より前には対応していません。' };
  if (y > MAX) return { html: `このゲームで扱うのは${MAX}年までです。` };
  if (y < MIN) {
    const hit = REAL_ERAS.filter((e) => e.start <= y && y <= e.end);
    const html = hit.map((e) => {
      const note = y === e.start && e.from ? `（${e.from}〜）` : y === e.end && e.to ? `（〜${e.to}）` : '';
      return `<strong>${yearLabel(e.name, y - e.start + 1)}</strong><small>${note}</small>`;
    }).join(' ／ ');
    return { html: `西暦${y}年は ${html}`, label: hit.map((e) => yearLabel(e.name, y - e.start + 1)).join('／') };
  }
  const e = eraAt(y);
  if (!e) {
    return {
      html: `西暦${y}年の元号は<b>まだ決まっていません</b>。<div class="share-row"><button type="button" class="btn-sub" data-claim="${y}">${y}年から制定する</button></div>`,
    };
  }
  const label = yearLabel(e.name, y - e.start_year + 1);
  const len = e.end_year - e.start_year + 1;
  return {
    html: `西暦${y}年は <strong>${esc(label)}</strong><br><small>元号「${esc(e.name)}」${periodText(e.start_year, e.end_year)}（${len}年間）${mine.has(e.id) ? ' ★あなたが制定' : ''}</small>`,
    label,
  };
}

function showConversion() {
  const v = $('convYear').value;
  if (!v) {
    $('convResult').innerHTML = '西暦を入力すると、その年が元号何年かを表示します。';
    return;
  }
  const y = Number(v);
  const info = convertInfo(y);
  const share = info.label
    ? `<div class="share-row"><a class="btn-x" href="${esc(xIntent(`西暦${y}年は${info.label}です`))}" target="_blank" rel="noopener">𝕏 でシェア</a></div>`
    : '';
  $('convResult').innerHTML = info.html + share;
}

// ===== ダイアログ =====
function askConfirm(f) {
  const d = $('confirmDlg');
  if (typeof d.showModal !== 'function') {
    return Promise.resolve(confirm(`元号「${f.name}」を${periodText(f.start, f.end)}として制定します。\n制定後は変更・取り消しができません。`));
  }
  return new Promise((resolve) => {
    $('cfName').textContent = f.name;
    $('cfText').textContent = `${periodText(f.start, f.end)}（${f.len}年間）`;
    d.onclick = (ev) => {
      const b = ev.target.closest('[data-ans]');
      if (!b) return;
      d.close();
      resolve(b.dataset.ans === 'yes');
    };
    d.oncancel = () => resolve(false);
    d.showModal();
  });
}

function showDone(era) {
  const d = $('done');
  if (typeof d.showModal !== 'function') {
    toast(`「${era.name}」を制定しました！一覧からシェアできます`);
    return;
  }
  $('doneName').textContent = era.name;
  $('doneText').textContent = `${periodText(era.start_year, era.end_year)}の元号は「${era.name}」に決まりました。`;
  $('doneShare').href = xIntent(eraShareText(era));
  d.showModal();
}

async function refresh() {
  if (!store) return;
  lastRefresh = Date.now();
  try {
    eras = (await store.list()).sort((a, b) => a.start_year - b.start_year);
  } catch (err) {
    console.error(err);
    toast(errorMessage(err), true);
  }
  renderStats();
  renderTimeline();
  renderList();
  updateForm();
  showConversion();
}

// ===== イベント =====
$('name').addEventListener('input', () => updateForm());
$('start').addEventListener('input', () => updateForm({ follow: true }));
$('len').addEventListener('change', () => updateForm());
$('form').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-step]');
  if (b) stepYear(Number(b.dataset.step));
});
$('nextFree').addEventListener('click', () => {
  const y = firstFreeYear();
  if (!y) return toast('空いている年がありません', true);
  $('start').value = y;
  updateForm({ follow: true });
});

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const f = readForm();
  if (!f.ok || busy || !store) return;
  $('name').blur();
  if (!(await askConfirm(f))) return;
  busy = true;
  $('submit').textContent = '制定中…';
  updateForm();
  try {
    const row = await store.create({ name: f.name, start_year: f.start, end_year: f.end });
    mine.add(row.id);
    saveMine();
    $('name').value = '';
    await refresh();
    $('start').value = firstFreeYear() ?? '';
    showDone(row);
  } catch (err) {
    console.error(err);
    toast(errorMessage(err), true);
    await refresh();
  } finally {
    busy = false;
    $('submit').textContent = 'この元号を制定する';
    updateForm({ follow: true });
  }
});

$('track').addEventListener('click', (ev) => {
  const x = ev.clientX - $('track').getBoundingClientRect().left;
  const y = MIN + Math.floor(x / W);
  if (y < MIN || y > MAX) return;
  const e = eraAt(y);
  if (e) {
    $('convYear').value = y;
    showConversion();
    toast(`${y}年は${yearLabel(e.name, y - e.start_year + 1)}（${periodText(e.start_year, e.end_year)}）`);
  } else {
    $('start').value = y;
    updateForm();
    toast(`開始年を${y}年にしました`);
  }
});

$('tl').addEventListener('scroll', scheduleTimeline, { passive: true });
window.addEventListener('resize', scheduleTimeline);
$('ov').addEventListener('click', (ev) => {
  const rect = $('ov').getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
  scrollTimelineTo(MIN + Math.floor(ratio * TOTAL));
});

$('convForm').addEventListener('submit', (ev) => {
  ev.preventDefault();
  $('convYear').blur();
  showConversion();
});
$('convYear').addEventListener('input', () => {
  if ($('convYear').value.length >= 4) showConversion();
});
$('convResult').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-claim]');
  if (!b) return;
  $('start').value = b.dataset.claim;
  updateForm({ follow: true });
  $('make').scrollIntoView({ behavior: 'smooth' });
});

$('more').addEventListener('click', () => {
  listLimit += LIST_STEP;
  renderList();
});
$('reload').addEventListener('click', async () => {
  await refresh();
  toast('最新の状態に更新しました');
});
$('doneClose').addEventListener('click', () => $('done').close());
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 15000) refresh();
});

// ===== 起動 =====
async function init() {
  const online = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
  $('rules').textContent = `ルール：${MIN}〜${MAX}年／漢字2文字／期間は1〜${MAX_LENGTH}年／制定済みの期間とは重ねられません`;
  $('ovMin').textContent = MIN;
  $('ovMax').textContent = MAX;
  $('start').min = MIN;
  $('start').max = MAX;
  $('len').innerHTML = Array.from({ length: MAX_LENGTH }, (_, i) => `<option value="${i + 1}">${i + 1}年間</option>`).join('');
  $('len').value = '10';
  document.documentElement.style.setProperty('--w', `${W}px`);
  $('track').style.width = `${TOTAL * W}px`;
  showConversion();

  if (online && isSecretKey(CONFIG.SUPABASE_KEY)) {
    setMode('⚠ 秘密鍵が設定されています。Publishable key に変更してください', 'error');
    console.error('SUPABASE_KEY に secret / service_role キーは使用できません。');
    renderTimeline();
    return;
  }
  try {
    store = online ? await createSupabaseStore() : localStore;
    setMode(online ? '🌐 オンライン：全プレイヤーで共有中' : '💻 デモモード：この端末内だけに保存', online ? 'online' : '');
  } catch (err) {
    console.error(err);
    setMode('⚠ サーバーに接続できません。再読み込みしてください', 'error');
    renderTimeline();
    return;
  }
  await refresh();
  $('start').value = firstFreeYear() ?? '';
  updateForm({ follow: true });
}
init();
</script>
